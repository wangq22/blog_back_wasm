name = "blog_back_wasm"
main = "build/index.js"
compatibility_date = "2025-10-09"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

[build]
command = "cargo install -q worker-build && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "blog"
database_id = "4dfcc240-c8d4-4ee8-93c2-1870beb6e6bf"

# R2:封面图 + 文章 markdown
# 上线前执行一次: npx wrangler r2 bucket create blog-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "blog-media"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[vars]
CF_ACCESS_TEAM_DOMAIN = "https://charlie-cloud.cloudflareaccess.com"
CF_ACCESS_CLIENT_ID = "612762ea6875a634e1649d59b64a46be4b79f3929f8ca149e5f7eb7cb7957373"
# Account-backed Workers AI model used by the schedule planner.
SCHEDULE_AI_MODEL = "@cf/deepseek-ai/deepseek-v4-flash-0731"
# Local offset for the Ann Arbor timetable. Update this when the semester
# crosses a daylight-saving boundary.
SCHEDULE_UTC_OFFSET = "-04:00"
# 机密客户端 secret(绝对不要写进明文 vars,用命令设置):
#   npx wrangler secret put CF_ACCESS_CLIENT_SECRET
# 不设则 /api/auth/* 走纯 PKCE 公开客户端模式,两种都兼容
# 前端 Pages 重建钩子(Pages 项目 > Settings > Builds & deployments > Build hooks 建一个):
#   npx wrangler secret put PAGES_DEPLOY_HOOK_URL
# 增/改/删文章成功后 Worker 会 POST 它触发重建;不设则不触发(本地开发可不设)

[[routes]]
pattern = "blog-api.charlie-cloud.me/*"
zone_name = "charlie-cloud.me"
