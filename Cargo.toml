[package]
name = "blog_back_wasm"
version = "0.1.0"
edition = "2021"
authors = ["Charlie Wang <wang.18083@buckeyemail.osu.edu>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.6", features = ['http', 'axum', "d1"] }
worker-macros = { version = "0.6", features = ['http'] }
axum = { version = "0.8", default-features = false, features = ["macros", "json", "query"] }
tower-service = "0.3.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
time = { version = "0.3.36", features = ["serde", "parsing", "formatting"] }
reqwest = { version = "0.12", features = ["json"] }
tower-http = {version = "0.6.6", features = ["cors"]}
jsonwebtoken = { version = "9", default-features = false }
reqwest-wasm = "0.11"
