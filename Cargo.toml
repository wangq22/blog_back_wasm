[package]
name = "blog_back_wasm"
version = "0.1.0"
edition = "2021"
authors = ["Charlie Wang <wang.18083@buckeyemail.osu.edu>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http', 'axum', "d1"] }
worker-macros = { version = "0.8", features = ['http'] }
axum = { version = "0.8", default-features = false, features = ["macros", "json", "query"] }
tower-service = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "parsing", "formatting"] }
reqwest = { version = "0.13", features = ["json"] }
tower-http = {version = "0.7", features = ["cors"]}
jsonwebtoken = { version = "11"}
reqwest-wasm = "0.11"

# jsonwebtoken 10+ 走 RustCrypto(rand/getrandom),wasm32 目标需开启 js 后端,
# 否则编译 getrandom 0.2 会报 "wasm*-unknown-unknown targets are not supported"
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
